[package]
name = "amll-ttml-tool"
version = "0.1.0"
description = "A brand-new syllable lyric editor for Apple Music-like lyrics"
license = "GPL-3.0"
repository = "https://github.com/amll-dev/amll-ttml-tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amll_ttml_tool_lib"
# The desktop executable links this library statically. Exporting the entire
# application as a Windows DLL exceeds PE's 65,535 exported-symbol limit.
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
aes = "0.8"
base64 = "0.22"
cipher = "0.4"
flate2 = "1"
hex = "0.4"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "native-tls"] }
tauri = { version = "2.9.5", features = ["devtools"] }
tao = "0.35"
tauri-plugin-log = "2.8.0"
window-vibrancy = "0.7"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = "1"
tauri-plugin-process = "2.3.1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
