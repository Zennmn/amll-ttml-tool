[package]
name = "amll-lyrics-service"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
aes = "0.8"
axum = "0.8"
base64 = "0.22"
cipher = "0.4"
flate2 = "1"
hex = "0.4"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
